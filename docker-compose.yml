services:
  homelab-portal-init:
    image: montaglabs/homelab-portal:latest
    pull_policy: always
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "1000:1000", "/app/server/data"]
    volumes:
      - ./server/data:/app/server/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

  homelab-portal:
    image: montaglabs/homelab-portal:latest
    pull_policy: always
    container_name: homelab-portal
    depends_on:
      homelab-portal-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      UPDATE_MODE: docker
      PORT: 4000
      LOG_DIR: /app/server/data/logs
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the environment or a .env file}
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/config').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
