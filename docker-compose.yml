services:
  homelab-portal:
    image: montaglabs/homelab-portal:latest
    pull_policy: always
    container_name: homelab-portal
    environment:
      APP_ENV: production
      UPDATE_MODE: docker
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/config').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
